<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PKlab POS SYSTEM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    /* CSSはそのまま使用（一部調整） */
    :root { --main: #0d124a; --bg: #f1f5f9; --accent: #facc15; --danger: #ef4444; }
    body { background: var(--bg); color: #333; padding-bottom: 120px; font-family: sans-serif; }
    .sticky-top { background: #fff; border-bottom: 2px solid var(--main); padding: 10px 15px !important; z-index: 1020; }
    .filter-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .filter-btn { padding: 4px 12px; font-size: 0.75rem; font-weight: bold; border-radius: 20px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
    .filter-btn.active { background: var(--main); color: white; border-color: var(--main); }
    /* ...その他のCSSは前回のものを継承... */
  </style>
</head>
<body>

<div id="main-ui" class="no-print">
  <div class="sticky-top shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div class="fw-bold" style="color:var(--main);">PKlab POS SYSTEM</div>
      <div class="btn-group">
        <button id="btn-table" class="btn btn-sm btn-outline-dark" onclick="switchView('table')">リスト</button>
        <button id="btn-grid" class="btn btn-sm btn-outline-dark active" onclick="switchView('grid')">タイル</button>
      </div>
    </div>
    
    <div class="d-flex align-items-center gap-2 overflow-auto pb-1">
      <button class="btn btn-primary btn-sm fw-bold px-3" onclick="createNewCase()">新規</button>
      <div id="case-list-area" class="d-flex gap-1"></div>
      <div class="border-start ps-2 ms-1 d-flex align-items-center">
        <select id="waiting-select" class="form-select form-select-sm fw-bold border-warning" onchange="handleWaitingSelect(this)">
          <option value="">⏳ 待機中リスト...</option>
        </select>
      </div>
    </div>
  </div>

  <div class="search-area shadow-sm">
    <div class="row g-2 mb-1">
      <div class="col-4"><input type="text" id="cust-name" class="form-control form-control-sm fw-bold" placeholder="顧客名" oninput="autoUpdateCaseName()"></div>
      <div class="col-5"><input type="text" id="search" class="form-control form-control-sm" placeholder="カード名・型番検索..." oninput="draw()"></div>
      <div class="col-3"><button class="btn btn-dark btn-sm w-100 fw-bold" onclick="showReceipt()">明細確認</button></div>
    </div>
    <div id="filter-btns" class="filter-grid"></div>
  </div>
  <div id="display-container"></div>
</div>

<script>
  const GAS_URL = "ここにデプロイ後のURLを貼る";
  let cards = [], inputs = {}, activeCaseId = "default", cases = {}, currentRarity = "ALL", currentView = "grid";

  window.onload = async () => {
    const saved = localStorage.getItem('rairai_pos_v29');
    if (saved) { cases = JSON.parse(saved); activeCaseId = localStorage.getItem('rairai_pos_active_id') || Object.keys(cases)[0]; } 
    else { createNewCase(); }
    
    try { 
      const res = await fetch(GAS_URL); 
      cards = await res.json(); 
      createRarityFilters();
      draw(); 
      loadCase(activeCaseId); 
    } catch(e) { console.error(e); }
    setInterval(refreshWaiting, 15000); refreshWaiting();
  };

  // A列のレアリティを抽出してボタンを生成
  function createRarityFilters() {
    const fb = document.getElementById('filter-btns');
    const rarities = ["ALL", ...new Set(cards.map(c => c.rarity).filter(r => r))];
    fb.innerHTML = "";
    rarities.forEach(r => {
      const b = document.createElement('button');
      b.className = `filter-btn ${r === "ALL" ? "active" : ""}`;
      b.innerText = r;
      b.onclick = function() {
        document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        currentRarity = r;
        draw();
      };
      fb.appendChild(b);
    });
  }

  function draw() {
    const container = document.getElementById('display-container');
    const sw = document.getElementById('search').value.toLowerCase();
    
    // 検索フィルタ + レアリティフィルタ
    const filtered = cards.filter(c => {
      const matchSearch = c.name.toLowerCase().includes(sw) || c.code.toLowerCase().includes(sw);
      const matchRarity = (currentRarity === "ALL" || c.rarity === currentRarity);
      return matchSearch && matchRarity;
    });
    
    if (currentView === 'table') {
      let html = `<div class="main-table-container"><table class="main-table"><thead><tr><th>商品名</th><th>A</th><th>B</th><th>C</th><th>D</th></tr></thead><tbody>`;
      html += filtered.map(c => {
        const ctrls = ['A','B','C','D'].map(t => {
          const q = inputs[c.name+'-'+t]?.q || 0; const p = c['price'+t] || 0;
          return `<td><div class="qty-ctrl ${q>0?'has-value':''}"><button class="qty-btn" onclick="changeQty('${c.name}','${t}',${p},-1)">-</button><input type="number" class="qty-num" value="${q||''}" onchange="updateQtyManually('${c.name}','${t}',${p},this.value)" placeholder="0"><button class="qty-btn" onclick="changeQty('${c.name}','${t}',${p},1)">+</button></div><div class="text-center text-danger small mt-1">¥${p.toLocaleString()}</div></td>`;
        }).join('');
        return `<tr><td><div class="d-flex align-items-center gap-2"><img src="${c.image}" style="width:35px;"><div class="lh-1"><div class="small fw-bold">${c.name}</div><div style="font-size:0.6rem" class="text-secondary">${c.code} / ${c.rarity}</div></div></div></td>${ctrls}</tr>`;
      }).join('');
      container.innerHTML = html + `</tbody></table></div>`;
    } else {
      let html = `<div class="card-grid">`;
      html += filtered.map(c => {
        const rows = ['A','B','C','D'].map(t => {
          const q = inputs[c.name+'-'+t]?.q || 0; const p = c['price'+t] || 0;
          return `<tr><td style="font-weight:900">${t}</td><td class="price-tag">¥${p.toLocaleString()}</td><td class="text-end"><div class="qty-ctrl ${q>0?'has-value':''}"><button class="qty-btn" onclick="changeQty('${c.name}','${t}',${p},-1)">-</button><input type="number" class="qty-num" value="${q||''}" onchange="updateQtyManually('${c.name}','${t}',${p},this.value)" placeholder="0"><button class="qty-btn" onclick="changeQty('${c.name}','${t}',${p},1)">+</button></div></td></tr>`;
        }).join('');
        const hasV = ['A','B','C','D'].some(t => (inputs[c.name+'-'+t]?.q || 0) > 0);
        return `<div class="grid-item ${hasV?'has-value':''}"><img src="${c.image}" class="grid-img"><div class="grid-card-name">${c.name}<br><small class="text-secondary">${c.code} [${c.rarity}]</small></div><table class="grid-ctrl-table">${rows}</table></div>`;
      }).join('');
      container.innerHTML = html + `</div>`;
    }
    calc();
  }

  /* ...calc, switchView, showReceipt, finalizeTrade, refreshWaiting 
     などの関数はランクSの処理を削って「A,B,C,D」に対応させる形で前回のものをそのまま使用...
  */
</script>
</body>
</html>
