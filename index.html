        tel: activeCase.tel || "",
        totalQty: summary.quantity,
        totalAmount: summary.amount,
        items: Object.values(inputs).filter(item => Number(item.q) > 0),
        bankName: activeCase.bankName || "",
        bankBranch: activeCase.bankBranch || "",
        bankType: activeCase.bankType || "",
        bankNum: activeCase.bankNum || "",
        bankHolder: activeCase.bankHolder || ""
      };

      try {
        const result = await fetchJson(GAS_URL, { method: "POST", body: JSON.stringify(tradeData) }, 20000);
        if (result?.result !== "SUCCESS") throw new Error(result?.message || "保存結果が不明です");
        showToast("買取を確定・保存しました");
        delete cases[activeCaseId];
        activeCaseId = Object.keys(cases)[0] || "";
        document.getElementById("receipt").style.display = "none";
        document.getElementById("main-ui").style.display = "block";
        document.body.classList.remove("receipt-open");
        if (!activeCaseId) createNewCase({ focusName: false, notify: false });
        else loadCase(activeCaseId);
        persistCases();
      } catch (error) {
        console.error("買取確定に失敗しました。", error);
        showToast("保存に失敗しました。通信状況を確認してください", "error");
      } finally {
        button.disabled = false;
        button.innerHTML = `<i class="bi bi-cloud-check me-1" aria-hidden="true"></i>買取確定・保存`;
      }
    }

    async function saveTemp() {
      const activeCase = cases[activeCaseId] || {};
      const name = document.getElementById("cust-name").value.trim();
      const summary = getInputSummary(inputs);
      if (!name) {
        document.getElementById("cust-name").focus();
        showToast("お客様名を入力してください", "error");
        return;
      }
      if (!summary.quantity) {
        showToast("商品を1点以上追加してください", "error");
        return;
      }

      saveCurrentCase();
      const button = document.getElementById("btn-save-temp");
      button.disabled = true;
      const original = button.innerHTML;
      button.innerHTML = `<span class="spinner-border spinner-border-sm" aria-hidden="true"></span><span>保存中</span>`;

      try {
        const result = await fetchJson(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "save_temp",
            customerName: name,
            tel: activeCase.tel || "",
            items: inputs,
            totalQty: summary.quantity,
            totalAmount: summary.amount
          })
        }, 20000);
        if (result?.result && result.result !== "SUCCESS") throw new Error(result.message || "一時保存に失敗しました");
        showToast("一時保存しました");
      } catch (error) {
        console.error("一時保存に失敗しました。", error);
        showToast("一時保存に失敗しました", "error");
      } finally {
        button.disabled = false;
        button.innerHTML = original;
      }
    }

    async function loadTradeLogs() {
      const container = document.getElementById("logs-container");
      container.innerHTML = statePanel("bi-arrow-repeat", "履歴を読み込んでいます", "しばらくお待ちください。");
      try {
        const response = await fetchJson(`${GAS_URL}?action=getTradeLogs`, {}, 20000);
        tradeLogs = Array.isArray(response) ? response : [];
        if (!tradeLogs.length) {
          container.innerHTML = statePanel("bi-clock-history", "買取履歴はありません", "買取を確定すると、ここに履歴が表示されます。");
          return;
        }
        container.innerHTML = tradeLogs.map((log, index) => `
          <article class="log-item">
            <div>
              <div class="log-name">${escapeHtml(log.name || "氏名未設定")} 様</div>
              <div class="log-meta">${escapeHtml(log.date || "日時不明")}・${toNonNegativeNumber(log.totalQty)}枚 買取完了</div>
            </div>
            <div class="log-side">
              <div class="log-amount">¥${formatNumber(log.totalAmount)}</div>
              <button class="log-detail-btn" type="button" data-log-index="${index}">明細を表示</button>
            </div>
          </article>`).join("");
      } catch (error) {
        console.error("履歴の取得に失敗しました。", error);
        container.innerHTML = statePanel("bi-cloud-slash", "履歴を取得できませんでした", "通信状況を確認して再読み込みしてください。", "再読み込み", "loadTradeLogs()");
      }
    }

    function showLogDetail(index) {
      const logData = tradeLogs[index];
      if (!logData) return;
      try {
        const logItems = Array.isArray(logData.items) ? logData.items : JSON.parse(logData.items || "[]");
        const logInputs = {};
        logItems.forEach(item => {
          if (!item || !item.n || !item.t) return;
          logInputs[`${item.n}-${item.t}`] = {
            n: String(item.n),
            t: String(item.t),
            p: toNonNegativeNumber(item.p),
            q: toNonNegativeNumber(item.q)
          };
        });
        isViewingLog = true;
        tempLogMeta = { name: String(logData.name || "氏名未設定") };
        inputs = logInputs;
        showReceipt();
      } catch (error) {
        console.error("履歴明細の表示に失敗しました。", error);
        showToast("明細データを表示できませんでした", "error");
      }
    }

    async function refreshWaiting() {
      const select = document.getElementById("waiting-select");
      const previousValue = select.value;
      try {
        const response = await fetchJson(`${GAS_URL}?action=getWaiting`, {}, 12000);
        waitingList = Array.isArray(response) ? response : [];
        select.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = waitingList.length ? `待機中 ${waitingList.length}名` : "待機中 0名";
        select.appendChild(placeholder);
        waitingList.forEach((customer, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `${customer.name || "氏名未設定"} 様`;
          select.appendChild(option);
        });
        if ([...select.options].some(option => option.value === previousValue)) select.value = previousValue;
      } catch (error) {
        console.warn("待機中リストの取得に失敗しました。", error);
        if (!waitingList.length) {
          select.innerHTML = `<option value="">待機中 取得失敗</option>`;
        }
      }
    }

    async function handleWaitingSelect(selectObject) {
      const index = Number(selectObject.value);
      if (selectObject.value === "" || !waitingList[index]) return;
      const customer = waitingList[index];
      if (!window.confirm(`${customer.name || "氏名未設定"} 様の査定を開始しますか？`)) {
        selectObject.value = "";
        return;
      }

      if (activeCaseId && cases[activeCaseId]) saveCurrentCase();
      const id = `c_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      cases[id] = {
        name: customer.name || "氏名未設定",
        tel: customer.tel || "",
        cancelIfSubMax: customer.cancelStatus || "希望しない",
        bankName: customer.bankName || "",
        bankBranch: customer.bankBranch || "",
        bankType: customer.bankType || "",
        bankNum: customer.bankNum || "",
        bankHolder: customer.bankHolder || "",
        data: {}
      };
      activeCaseId = id;
      inputs = {};
      persistCases();
      loadCase(id);

      try {
        await fetchJson(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "update_status",
            customerName: customer.name || "",
            newStatus: "査定中"
          })
        }, 15000);
        showToast(`${customer.name || "お客様"} 様の査定を開始しました`);
      } catch (error) {
        console.warn("待機ステータスの更新に失敗しました。", error);
        showToast("査定は開始しましたが、待機ステータスの更新に失敗しました", "error");
      } finally {
        refreshWaiting();
        selectObject.value = "";
      }
    }

    function resetAll() {
      const message = "この端末に保存されている全ての査定中データを削除しますか？\n確定済みの買取履歴は削除されません。";
      if (!window.confirm(message)) return;
      [STORAGE_KEY, ACTIVE_CASE_KEY, VIEW_MODE_KEY, PER_PAGE_KEY].forEach(key => localStorage.removeItem(key));
      cases = {};
      inputs = {};
      activeCaseId = "";
      currentRarity = "ALL";
      currentKana = "";
      selectedOnly = false;
      viewMode = "grid";
      itemsPerPage = 20;
      document.getElementById("search").value = "";
      document.getElementById("selected-only").checked = false;
      document.getElementById("per-page").value = "20";
      createNewCase({ focusName: false, notify: false });
      renderViewControls();
      createKanaFilters();
      createRarityFilters();
      draw();
      showToast("端末の査定中データを初期化しました");
    }

    function statePanel(icon, title, text, actionLabel = "", action = "") {
      return `
        <div class="state-panel">
          <div>
            <div class="state-icon"><i class="bi ${escapeHtml(icon)}" aria-hidden="true"></i></div>
            <div class="state-title">${escapeHtml(title)}</div>
            <div class="state-text">${escapeHtml(text)}</div>
            ${actionLabel && action ? `<button class="state-action" type="button" onclick="${action}">${escapeHtml(actionLabel)}</button>` : ""}
          </div>
        </div>`;
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `app-toast ${type}`;
      toast.innerHTML = `<i class="bi ${type === "error" ? "bi-exclamation-circle-fill" : "bi-check-circle-fill"}" aria-hidden="true"></i><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      window.setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-5px)";
        window.setTimeout(() => toast.remove(), 180);
      }, 3200);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safeImageUrl(value) {
      const url = String(value || "").trim();
      return /^(https?:\/\/|data:image\/)/i.test(url) ? url : "";
    }

    function toNonNegativeNumber(value) {
      const number = Number(String(value ?? 0).replace(/,/g, ""));
      return Number.isFinite(number) ? Math.max(0, number) : 0;
    }

    function formatNumber(value) {
      return toNonNegativeNumber(value).toLocaleString("ja-JP");
    }
  </script>
</body>
</html>
